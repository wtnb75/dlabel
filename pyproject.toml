[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlabel"
dynamic = ["version"]
description = "docker label utilities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Watanabe Takashi", email = "wtnb75@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "docker",
    "click",
    "pyyaml",
    "crossplane",
    "dictknife",
    "toml",
    "pydantic",
    "fastapi",
    "jsonpointer",
]

[project.optional-dependencies]
ssh = [
    "paramiko",
]

[project.scripts]
dlabel = "dlabel.main:cli"

[project.urls]
Homepage = "https://github.com/wtnb75/dlabel"

[tool.hatch.version]
path = "dlabel/version.py"
pattern = "VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["dlabel"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-github-actions-annotate-failures",
    "ruff",
    "pdoc",
    "httpx",
]

[tool.ruff.lint]
# TRY002: dlabel/traefik.py raises plain Exception for two input-validation
# cases (traefik config missing an `http` section) that are meant to
# propagate as a generic failure to the CLI/API caller - no caller expects a
# specific exception type. Introducing a custom exception hierarchy here is
# a design change out of scope for this packaging migration, so it is
# intentionally ignored rather than mechanically "fixed".
ignore = ["TRY002"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--cov-report=html:cover --cov-report=term --cov-branch --cov-reset --cov=dlabel --doctest-modules"
